default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: list_it_development

test:
  <<: *default
  database: list_it_test

# In production set DATABASE_URL, e.g. postgres://list_it:secret@db:5432/list_it_production
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
